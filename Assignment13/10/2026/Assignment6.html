<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

body {
    background-color: #10141c;
}

.scoreboard {
    height: 530px;
    background-color: #10243b;
    border: 2px solid white;
    border-radius: 5px;
    text-align: center;
    padding: 10px;
}

.logo {
    color: white;
    font-size: 22px;
    line-height: 20px;
    margin-top: 15px;
}

.teams {
    margin-top: 55px;
}

.team {
    display: inline-block;
    width: 32%;
    height: 240px;
    border-radius: 15px;
    color: white;
    margin: 0 30px;
    vertical-align: top;
}

.india {
    background-color: #1765b5;
}

.pakistan {
    background-color: #42ad32;
}

.team h1 {
    font-size: 50px;
    margin-top: 30px;
    margin-bottom: 30px;
}

.balls {
    margin-top: 10px;
}

.balls span {
    display: inline-block;
    background-color: white;
    color: black;
    width: 32px;
    height: 32px;
    line-height: 32px;
    border-radius: 50%;
    font-size: 20px;
    font-weight: bold;
    margin: 1px;
}

.team h2 {
    font-size: 30px;
    margin-top: 20px;
}

.buttons {
    margin-top: 55px;
}

button {
    width: 70px;
    height: 70px;
    font-size: 45px;
    color: white;
    border: 4px solid white;
    border-radius: 20px;
    margin: 0 15px;
}

.edit {
    background-color: #ffb928;
}

.reset {
    background-color: #e52d35;
}


    </style>
</head>
<body>
<!DOCTYPE html>
<html>
<head>
    <title>Cricket Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scoreboard">

        <h2 class="logo">🏏 SUPER<br> OVER</h2>

        <div class="teams">

            <div class="team india">
                <h1>IND</h1>

                <div class="balls">
                    <span>4</span>
                    <span>3</span>
                    <span>2</span>
                    <span>6</span>
                    <span>6</span>
                    <span>6</span>
                </div>

                <h2>27/0</h2>
            </div>

            <div class="team pakistan">
                <h1>PAK</h1>

                <div class="balls">
                    <span>2</span>
                    <span>4</span>
                    <span>0</span>
                    <span>3</span>
                    <span>1</span>
                    <span>4</span>
                </div>

                <h2>14/0</h2>
            </div>

        </div>

        <div class="buttons">
            <button class="edit">🏏</button>
            <button class="reset">⟲</button>
        </div>

    </div>

</body>
</html>


</body>
</html>
