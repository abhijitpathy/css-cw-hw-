<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>

body {
    margin: 0;
    background-color: #101116;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.calculator {
    width: 573px;
    background-color: #1c1c1c;
    padding: 20px 39px 32px;
    border-radius: 5px;
}

.display {
    height: 190px;
    color: white;
    font-size: 130px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-right: 10px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
}

button {
    width: 103px;
    height: 102px;
    border: none;
    border-radius: 50%;
    background-color: #505050;
    color: white;
    font-size: 30px;
}

.light {
    background-color: #aaa;
    color: #222;
}

.operator {
    background-color: #ff9800;
    color: white;
}

.zero {
    flex: 1;
    border-radius: 60px;
    text-align: left;
    padding-left: 110px;
}

button:hover {
    opacity: 0.8;
}

    </style>
</head>
<body>

    <div class="calculator">

        <div class="display">7744</div>

        <div class="buttons">
            <div class="row">
                <button class="light">C</button>
                <button class="light">+/-</button>
                <button class="light">%</button>
                <button class="operator">÷</button>
            </div>

            <div class="row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">X</button>
            </div>

            <div class="row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">-</button>
            </div>

            <div class="row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">+</button>
            </div>

            <div class="row">
                <button class="zero">0</button>
                <button>,</button>
                <button class="operator">=</button>
            </div>
        </div>

    </div>

</body>
</html>
